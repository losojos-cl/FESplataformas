<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FES Plataformas — Ficha de país</title>

    <!-- Tipografía del sistema de diseño -->
    <link rel="preload" href="webfonts/Ebert-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="webfonts/Ebert-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/theme.css">
</head>

<body class="fes-page">
    <div class="fes-fondo" aria-hidden="true"></div>

    <nav class="fes-topbar" aria-label="Barra superior">
        <a class="fes-tab" href="index.html" title="Volver al mapa" aria-label="Volver al mapa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <span class="fes-topbar-brand">FES Plataformas</span>
        <div class="fes-acciones">
            <a class="fes-btn violeta" href="paises.html" title="Ver todos los países">repositorio</a>
        </div>
    </nav>

    <main class="fes-main">
        <article class="fes-doc" id="country-container">
            <h1 class="fes-doc-title">Ficha de país</h1>
            <div class="fes-skeleton ancho-60 alto-32"></div>
            <div class="fes-skeleton ancho-80"></div>
            <div class="fes-skeleton"></div>
            <div class="fes-skeleton ancho-80"></div>
            <div class="fes-skeleton ancho-60"></div>
        </article>
    </main>

    <footer class="fes-footer">
        <p>Plataforma de información sindical &copy; <span id="current-year"></span></p>
    </footer>

    <script>
        'use strict';

        const urlParams = new URLSearchParams(window.location.search);
        const countryId = urlParams.get('country');
        document.getElementById('current-year').textContent = new Date().getFullYear();

        let legislacionData = null;

        // Normalización de slugs: sin acentos ni espacios (coincide con el slugify del index)
        function slugify(name) {
            return String(name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-');
        }

        // Compat con los slugs históricos embebidos en URLPAIS (con acentos)
        function slugLegacy(name) {
            return String(name || '').toLowerCase().replace(/\s+/g, '-');
        }

        function esc(value) {
            const d = document.createElement('div');
            d.textContent = String(value == null ? '' : value);
            return d.innerHTML;
        }

        if (countryId) {
            Promise.all([
                fetch('./data/legislacion.json').then(r => r.json()).catch(() => ({})),
                loadCountryDataRaw(countryId)
            ]).then(([legData, countryFeature]) => {
                legislacionData = legData;
                countryFeature ? displayCountry(countryFeature) : showError('País no encontrado');
            }).catch(() => showError('Error al cargar datos'));
        } else {
            showError('No se especificó un país para mostrar');
        }

        function loadCountryDataRaw(countryId) {
            return Promise.all([
                fetch('./data/paises-geo.json').then(r => r.json()),
                fetch('./data/paises-props.json').then(r => r.json())
            ]).then(([geo, props]) => {
                const wanted = slugify(countryId);
                const feature = geo.features.find(f => {
                    const name = f.properties.COUNTRY;
                    return name && (slugify(name) === wanted || slugLegacy(name) === countryId.toLowerCase());
                });
                if (!feature) return null;
                return { ...feature, properties: { ...feature.properties, ...props[feature.properties.COUNTRY] } };
            });
        }

        function estadoClass(estado) {
            const e = String(estado || '').toLowerCase();
            if (e.includes('sancionada') || e.includes('vigente') || e.includes('publicada')) return 'estado-vigente';
            if (e.includes('tramitaci') || e.includes('trámite') || e.includes('ingresado') || e.includes('presentado')) return 'estado-tramite';
            if (e.includes('derogado') || e.includes('caducado') || e.includes('archivado')) return 'estado-caido';
            if (e.includes('no se localiz') || e.includes('sin sanci') || e.includes('sin norma')) return 'estado-sin-norma';
            return 'estado-otro';
        }

        function renderLegislacionHTML(countryName) {
            if (!legislacionData || !legislacionData[countryName] || legislacionData[countryName].length === 0) {
                return '<p><small>No disponible</small></p>';
            }
            let html = '';
            legislacionData[countryName].forEach(entry => {
                html += '<div class="fes-leg-item">'
                    + '<span class="fes-leg-norma">' + esc(String(entry.tipo) + ' ' + String(entry.norma)).trim() + '</span>'
                    + '<span class="fes-leg-estado ' + estadoClass(entry.estado) + '">' + esc(entry.estado) + '</span>';
                if (entry.alcance) html += '<p class="fes-leg-alcance">' + esc(entry.alcance) + '</p>';
                if (entry.enlace) html += '<a href="' + entry.enlace + '" target="_blank" rel="noopener noreferrer">ver norma</a>';
                if (entry.enlace2) html += '<a href="' + entry.enlace2 + '" target="_blank" rel="noopener noreferrer">fuente adicional</a>';
                html += '</div>';
            });
            return html;
        }

        function renderCentrales(props) {
            const centrales = [];
            for (let i = 1; i <= 7; i++) {
                const name = props['CENTRAL' + i];
                if (name && String(name).trim() !== '') centrales.push({ i, name, res: props['RESENA' + i] });
            }
            if (centrales.length === 0) {
                return { html: '<p><small>No se registran centrales sindicales.</small></p>', count: 0 };
            }
            let html = '<div class="fes-accordion">';
            centrales.forEach(c => {
                if (c.res && String(c.res).trim() !== '') {
                    html += '<details><summary>' + esc(c.name) + '</summary>'
                        + '<div class="fes-accordion-body"><small>' + esc(c.res) + '</small></div></details>';
                } else {
                    // Sin reseña: ítem plano, sin el signo + (no es un error)
                    html += '<div class="fes-item-plain">' + esc(c.name) + '</div>';
                }
            });
            html += '</div>';
            return { html, count: centrales.length };
        }

        function displayCountry(feature) {
            const props = feature.properties;
            const centrales = renderCentrales(props);
            const mapaSlug = slugify(props.COUNTRY || '');

            document.getElementById('country-container').innerHTML = `
                <h1 class="fes-doc-title">${esc(props.COUNTRY || 'País sin nombre')}</h1>

                <div class="fes-badges">
                    <span class="fes-badge">Zona ${esc(props.ZONA || 'Sin zona')}</span>
                    <span class="fes-chip">${centrales.count} centrales sindicales</span>
                </div>

                <h3 class="fes-section-title">Descripción</h3>
                ${props.DESCRIPCION || '<p><small><em>No hay descripción disponible</em></small></p>'}

                <hr class="fes-divider">

                <h3 class="fes-section-title">Centrales sindicales</h3>
                ${centrales.html}

                <h3 class="fes-section-title">Legislación asociada</h3>
                ${renderLegislacionHTML(props.COUNTRY)}

                <h3 class="fes-section-title">Acciones</h3>
                <div style="display:flex; flex-wrap:wrap; gap:10px;">
                    <a class="fes-btn" href="index.html?pais=${encodeURIComponent(mapaSlug)}" title="Ver este país en el mapa">ir al mapa</a>
                    <a class="fes-btn violeta" href="paises.html" title="Volver al listado de países">volver al repositorio</a>
                </div>
            `;
            document.title = 'FES Plataformas — ' + (props.COUNTRY || 'País');
        }

        function showError(message) {
            document.getElementById('country-container').innerHTML = `
                <h1 class="fes-doc-title">Ficha de país</h1>
                <div class="fes-error">
                    <p><strong>${esc(message)}</strong></p>
                    <p><a class="fes-btn violeta" href="paises.html" style="margin-top:8px">volver al repositorio</a></p>
                </div>
            `;
        }
    </script>
</body>
</html>
